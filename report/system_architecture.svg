<svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>CORTEX TechMentor AI — System Architecture</title>
  <desc>Three-tier architecture: Next.js frontend, FastAPI backend with Groq LLM, and data/agent layers.</desc>

  <style>
    .title { font-size: 18px; font-weight: 700; fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
    .tier-label { font-size: 11px; font-weight: 700; fill: #475569; letter-spacing: 2px; text-transform: uppercase; font-family: system-ui, -apple-system, sans-serif; }
    .box-title { font-size: 12px; font-weight: 700; fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
    .box-sub { font-size: 9.5px; fill: #475569; font-family: system-ui, -apple-system, sans-serif; }
    .arrow { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .arrow-label { font-size: 9px; fill: #475569; font-family: system-ui, -apple-system, sans-serif; }
    .tier-bg { rx: 12; fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
  </style>

  <rect width="900" height="720" fill="#ffffff"/>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569" />
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">CORTEX / TechMentor AI — System Architecture</text>

  <rect x="30" y="50" width="840" height="120" class="tier-bg" />
  <text x="50" y="72" class="tier-label">Client Layer</text>

  <rect x="60" y="85" width="140" height="68" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="130" y="110" text-anchor="middle" class="box-title">Next.js 16 App</text>
  <text x="130" y="124" text-anchor="middle" class="box-sub">React 19 + Turbopack</text>
  <text x="130" y="136" text-anchor="middle" class="box-sub">Tailwind CSS 4</text>

  <rect x="230" y="85" width="130" height="68" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="295" y="110" text-anchor="middle" class="box-title">Dashboard</text>
  <text x="295" y="124" text-anchor="middle" class="box-sub">Mission Control</text>
  <text x="295" y="136" text-anchor="middle" class="box-sub">Digital Twin</text>

  <rect x="390" y="85" width="130" height="68" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="455" y="110" text-anchor="middle" class="box-title">Interview Room</text>
  <text x="455" y="124" text-anchor="middle" class="box-sub">Web Speech API</text>
  <text x="455" y="136" text-anchor="middle" class="box-sub">3-Panel Eval</text>

  <rect x="550" y="85" width="130" height="68" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="615" y="110" text-anchor="middle" class="box-title">Coding Room</text>
  <text x="615" y="124" text-anchor="middle" class="box-sub">Monaco Editor</text>
  <text x="615" y="136" text-anchor="middle" class="box-sub">Run / Debug / Review</text>

  <rect x="710" y="85" width="130" height="68" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="775" y="110" text-anchor="middle" class="box-title">Analytics</text>
  <text x="775" y="124" text-anchor="middle" class="box-sub">Session History</text>
  <text x="775" y="136" text-anchor="middle" class="box-sub">Real-time Scores</text>

  <line x1="450" y1="170" x2="450" y2="205" class="arrow" />
  <text x="470" y="192" class="arrow-label">REST / JSON</text>

  <rect x="30" y="210" width="840" height="190" class="tier-bg" />
  <text x="50" y="232" class="tier-label">Backend Layer</text>

  <rect x="60" y="248" width="200" height="68" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
  <text x="160" y="272" text-anchor="middle" class="box-title">FastAPI Server</text>
  <text x="160" y="286" text-anchor="middle" class="box-sub">CORS · Pydantic · Async</text>
  <text x="160" y="298" text-anchor="middle" class="box-sub">Port 8000</text>

  <rect x="290" y="248" width="200" height="68" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
  <text x="390" y="268" text-anchor="middle" class="box-title">API Endpoints</text>
  <text x="390" y="282" text-anchor="middle" class="box-sub">/quiz-tutor/respond</text>
  <text x="390" y="294" text-anchor="middle" class="box-sub">/interview · /coding-room</text>
  <text x="390" y="306" text-anchor="middle" class="box-sub">/execute · /debug</text>

  <rect x="520" y="248" width="170" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="605" y="272" text-anchor="middle" class="box-title">Groq Cloud API</text>
  <text x="605" y="286" text-anchor="middle" class="box-sub">Llama 3.3 70B</text>
  <text x="605" y="298" text-anchor="middle" class="box-sub">Ultra-fast inference</text>

  <rect x="720" y="248" width="130" height="68" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
  <text x="785" y="272" text-anchor="middle" class="box-title">Mission Engine</text>
  <text x="785" y="286" text-anchor="middle" class="box-sub">Profile Routing</text>
  <text x="785" y="298" text-anchor="middle" class="box-sub">Quiz Cap (2Q)</text>

  <line x1="260" y1="282" x2="290" y2="282" class="arrow" />
  <line x1="490" y1="282" x2="520" y2="282" class="arrow" />
  <line x1="690" y1="282" x2="720" y2="282" class="arrow" />

  <rect x="60" y="335" width="360" height="52" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="240" y="356" text-anchor="middle" class="box-title">Code Execution Engine (subprocess)</text>
  <text x="240" y="370" text-anchor="middle" class="box-sub">Python / JS / C++ · stdout / stderr capture</text>

  <rect x="450" y="335" width="280" height="52" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="590" y="356" text-anchor="middle" class="box-title">Session State</text>
  <text x="590" y="370" text-anchor="middle" class="box-sub">localStorage handoff · quiz history · interview result</text>

  <line x1="450" y1="400" x2="450" y2="430" class="arrow" />
  <text x="470" y="420" class="arrow-label">Orchestration</text>

  <rect x="30" y="435" width="840" height="120" class="tier-bg" />
  <text x="50" y="457" class="tier-label">CrewAI Multi-Agent Layer (9 Agents)</text>

  <rect x="50" y="470" width="150" height="42" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="125" y="490" text-anchor="middle" class="box-title">Professor</text>
  <text x="125" y="502" text-anchor="middle" class="box-sub">Orchestrator</text>

  <rect x="215" y="470" width="110" height="42" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="270" y="490" text-anchor="middle" class="box-title">Planner</text>
  <text x="270" y="502" text-anchor="middle" class="box-sub">Learning Path</text>

  <rect x="340" y="470" width="110" height="42" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="395" y="490" text-anchor="middle" class="box-title">Research</text>
  <text x="395" y="502" text-anchor="middle" class="box-sub">Content Mining</text>

  <rect x="465" y="470" width="110" height="42" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="520" y="490" text-anchor="middle" class="box-title">Teaching</text>
  <text x="520" y="502" text-anchor="middle" class="box-sub">Concept Delivery</text>

  <rect x="590" y="470" width="110" height="42" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="645" y="490" text-anchor="middle" class="box-title">Quiz</text>
  <text x="645" y="502" text-anchor="middle" class="box-sub">Adaptive Q&amp;A</text>

  <rect x="120" y="522" width="130" height="42" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="185" y="542" text-anchor="middle" class="box-title">Evaluation</text>
  <text x="185" y="554" text-anchor="middle" class="box-sub">Scoring Engine</text>

  <rect x="265" y="522" width="130" height="42" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="330" y="542" text-anchor="middle" class="box-title">Reflection</text>
  <text x="330" y="554" text-anchor="middle" class="box-sub">Gap Analysis</text>

  <rect x="410" y="522" width="140" height="42" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="480" y="542" text-anchor="middle" class="box-title">Interview Panel</text>
  <text x="480" y="554" text-anchor="middle" class="box-sub">Tech · HR · Recruiter</text>

  <rect x="565" y="522" width="130" height="42" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="630" y="542" text-anchor="middle" class="box-title">Memory</text>
  <text x="630" y="554" text-anchor="middle" class="box-sub">Student Digital Twin</text>

  <rect x="720" y="490" width="130" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="785" y="510" text-anchor="middle" class="box-sub" style="font-style:italic;">Scaffolded, not yet</text>
  <text x="785" y="522" text-anchor="middle" class="box-sub" style="font-style:italic;">wired to live path</text>

  <line x1="450" y1="570" x2="450" y2="600" class="arrow" />

  <rect x="30" y="605" width="840" height="105" class="tier-bg" />
  <text x="50" y="627" class="tier-label">Data &amp; Persistence</text>

  <rect x="80" y="640" width="180" height="52" rx="8" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="170" y="662" text-anchor="middle" class="box-title">SQLite + SQLAlchemy</text>
  <text x="170" y="676" text-anchor="middle" class="box-sub">User · DigitalTwin models</text>

  <rect x="290" y="640" width="160" height="52" rx="8" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="370" y="662" text-anchor="middle" class="box-title">ChromaDB</text>
  <text x="370" y="676" text-anchor="middle" class="box-sub">Vector Store (planned)</text>

  <rect x="480" y="640" width="160" height="52" rx="8" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="560" y="662" text-anchor="middle" class="box-title">localStorage</text>
  <text x="560" y="676" text-anchor="middle" class="box-sub">Session · Interview state</text>

  <rect x="670" y="640" width="170" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="755" y="662" text-anchor="middle" class="box-title">Groq API (External)</text>
  <text x="755" y="676" text-anchor="middle" class="box-sub">LLM-as-a-Service</text>

  <rect x="30" y="718" width="8" height="8" rx="2" fill="#6366f1"/>
  <text x="44" y="726" class="box-sub">Frontend</text>
  <rect x="110" y="718" width="8" height="8" rx="2" fill="#10b981"/>
  <text x="124" y="726" class="box-sub">Backend</text>
  <rect x="190" y="718" width="8" height="8" rx="2" fill="#ec4899"/>
  <text x="204" y="726" class="box-sub">Agents</text>
  <rect x="260" y="718" width="8" height="8" rx="2" fill="#0ea5e9"/>
  <text x="274" y="726" class="box-sub">Data</text>
  <rect x="320" y="718" width="8" height="8" rx="2" fill="#f59e0b"/>
  <text x="334" y="726" class="box-sub">External</text>
</svg>
