version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: techmentor-postgres
    environment:
      POSTGRES_USER: techmentor
      POSTGRES_PASSWORD: techmentorpassword
      POSTGRES_DB: techmentor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: techmentor-chromadb
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    restart: unless-stopped

volumes:
  postgres_data:
  chromadb_data:
